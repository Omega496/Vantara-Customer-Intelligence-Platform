[project]
name = "vantara-customer-intelligence"
version = "1.0.0"
description = "Machine Learning & Deep Learning Platform for Customer Churn, CLV, and Behavior Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "imbalanced-learn>=0.12.3",
    "joblib>=1.4.2",
    "lightgbm>=4.5.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.9.2",
    "numpy>=1.26.4,<2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "plotly>=5.24.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "ruff>=0.6.9",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "shap>=0.46.0",
    "sqlalchemy>=2.0.35",
    "streamlit>=1.39.0",
    "torch>=2.4.1",
    "tqdm>=4.66.5",
    "ucimlrepo>=0.0.7",
    "uvicorn>=0.30.6",
    "xgboost>=2.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "models_artifacts",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled where needed

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv.workspace]
members = [
    "Vantara Customer Intelligence Platform",
]
